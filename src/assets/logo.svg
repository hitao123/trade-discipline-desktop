<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Plain Rule">
  <!-- market / the field of trading -->
  <circle cx="24" cy="24" r="15.5" stroke="#20221f" stroke-width="2.5"/>
  <!-- the rule: a perfectly level beam extending past the circle -->
  <line x1="5" y1="24" x2="43" y2="24" stroke="#20221f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ruler end ticks -->
  <line x1="5" y1="19" x2="5" y2="29" stroke="#20221f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="43" y1="19" x2="43" y2="29" stroke="#20221f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="20.5" x2="14" y2="27.5" stroke="#20221f" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="20.5" x2="34" y2="27.5" stroke="#20221f" stroke-width="2" stroke-linecap="round"/>
  <!-- level bubble (the one true point): vermilion accent -->
  <circle cx="24" cy="24" r="4.6" fill="#b23b2b"/>
  <circle cx="24" cy="24" r="1.7" fill="#f8f6f0"/>
</svg>
