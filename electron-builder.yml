appId: com.local.shouzhuo.discipline
productName: Plain Rule
copyright: Copyright © 2026
icon: resources/icon.png
asar: true
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/bin/discipline-server
    to: bin/discipline-server
  - from: resources/bin/plain-rule-ocr
    to: bin/plain-rule-ocr
directories:
  output: release
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
dmg:
  artifactName: Plain Rule-${version}-${arch}.${ext}
npmRebuild: false
